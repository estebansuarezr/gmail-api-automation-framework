plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
}

group = 'com.estebansuarez'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'net.serenity-bdd:serenity-core:4.2.34'
    implementation 'net.serenity-bdd:serenity-screenplay:4.2.34'

    testImplementation 'net.serenity-bdd:serenity-cucumber:4.2.34'
    testImplementation 'junit:junit:4.13.2'

    implementation 'com.google.api-client:google-api-client:2.7.2'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.http-client:google-http-client-gson:1.45.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.1'

    implementation 'com.google.apis:google-api-services-drive:v3-rev20250723-2.0.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20260525-2.0.0'

    implementation 'com.sun.mail:jakarta.mail:2.0.1'
}