trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

  - checkout: self

  # Instalar Java 17
  - task: JavaToolInstaller@0
    displayName: 'Install Java 17'
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # Descargar credentials.json desde Secure Files (Google OAuth 2.0 / APIs)
  - task: DownloadSecureFile@1
    name: googleCredentials
    displayName: 'Download Google Credentials'
    inputs:
      secureFile: 'credentials.json'

  # Copiar las credenciales al directorio de recursos
  - script: |
      mkdir -p src/test/resources
      cp "$(googleCredentials.secureFilePath)" src/test/resources/credentials.json
    displayName: 'Copy credentials.json to resources'

  # Dar permisos de ejecución al wrapper de Gradle
  - script: chmod +x gradlew
    displayName: 'Grant execute permission to Gradlew'

  # Compilar el proyecto (sin ejecutar pruebas)
  - script: ./gradlew clean assemble
    displayName: 'Compile Project'